[project]
name = "adaptalux-control"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benson Margulies", email = "bimargulies@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bleak>=3.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
adaptalux-control = "adaptalux_control:main"

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
