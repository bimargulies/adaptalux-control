[project]
name = "adaptalux-control"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Benson Margulies", email = "bimargulies@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "bleak>=3.1.0",
    "pyyaml>=6.0.3",
]

[project.scripts]
adaptalux-control = "adaptalux_control:main"
adaptalux-gui = "adaptalux_control.gui:main"

[project.optional-dependencies]
gui = [
    "pyobjc-framework-cocoa>=10 ; sys_platform == 'darwin'",
    "pyside6-essentials>=6.8",
    "qasync>=0.27",
]

[build-system]
requires = ["uv_build>=0.11.23,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]
